            if (jsonObject.dataType == "EditableField") return new EditableField(jsonObject)
            if (jsonObject.dataType == "DropdownSelectionStat") return new DropdownSelectionStat(jsonObject)
            if (jsonObject.dataType == "CheckboxSelectionStat") return new CheckboxSelectionStat(jsonObject)
            if (jsonObject.dataType == "Stat") return new Stat(jsonObject)
            if (jsonObject.dataType == "Dynamic") return new Dynamic(jsonObject)
            if (jsonObject.dataType == "Weapon") return new Weapon(jsonObject)
            if (jsonObject.dataType == "Armor") return new Armor(jsonObject)
            if (jsonObject.dataType == "Accessory") return new Accessory(jsonObject)
            if (jsonObject.dataType == "Equipment") return new Equipment(jsonObject)
            if (jsonObject.dataType == "Item") return new Item(jsonObject)
            if (jsonObject.dataType == "Inventory") return new Inventory(jsonObject)
            if (jsonObject.dataType == "Action") return new Action(jsonObject)
            if (jsonObject.dataType == "Character") return new Character(jsonObject)
            if (jsonObject.dataType == "Brand") return new Brand(jsonObject)
            //Figure out what fucking class something is. And then reinstantiate it.
        }
        function recursiveInstantiateArray(jsonObject) {
            var returnarr = []
            for (const item of jsonObject) {
                returnarr.push(determineInstantiateClass(item))
            }
            return returnarr
            //Return an Array of properly instantiated objects.
        }
        function recursiveInstantiateMap(jsonObject) {
            var resultmap = new Map()
            for (const row of jsonObject) {
                
                resultmap.set(
                    row[0],
                    determineInstantiateClass(row[1])
                )
            }
            return resultmap
            //Return a properly instantiate Map with properly instantiated everyhting below it.
        }

        class Mutator extends IDRegistry(class { }) {
            dataType = "Mutator"
            constructor({
                source = "", 
                modifier = 0, 
                operation = "add", 
                parentid = null, 
                linkedstat = "",
                removable = true,
                ...args
            } = {}) {
                super(args)
                this.source = source
                this.operation = operation
                this.modifier = modifier
                this.parentid = parentid
                this.linkedstat = linkedstat
                this.removable = removable
                if (verbose) console.log(`Created ${this.id}.`)
            }
            static destroy(id) {
                Stat.ActiveObjects.get(Mutator.ActiveObjects.get(id).parentid).removebonus(id)
                Mutator.ActiveObjects.get(id).IDUnregister()
                Mutator.ActiveObjects.delete(id)
                if (verbose) console.log(`Destroyed ${id}.`)
            }
            mutate(value) {
                if (this.operation == "add") return value + this.modifier
                else if (this.operation == "mul") return value * this.modifier
                else if (this.operation == "percent") return value * (1 + (this.modifier / 100))
                else if (this.operation == "stat") return value + (this.modifier * this.getlinkedvalue())
            }
            update() {
                this.IDUpdate()
            }
            getlinkedvalue() {
                if (Character.CurrentCharacter.Stats.get(this.linkedstat)) return Character.CurrentCharacter.Stats.get(this.linkedstat).current
                else if (Stat.ActiveObjects.get(this.linkedstat)) return Stat.ActiveObjects.get(this.linkedstat).current
                else return NaN
            }
            toHTML() {
                var bonusstring = ""
                if (this.operation == "add") {
                    if (this.modifier >= 0) {
                        bonusstring = `+${this.modifier}`
                    }
                    else bonusstring = `${this.modifier}`
                }
                else if (this.operation == "mul") {
                    bonusstring = `${this.modifier}x`
                }
                else if (this.operation == "percent") {
                    if (this.modifier >= 0) {
                        bonusstring = `+${this.modifier}%`
                    }
                    else bonusstring = `${this.modifier}%`
                }
                else if (this.operation == "stat") {
                    if (this.modifier >= 0) {
                        bonusstring = `+${this.modifier}x ${this.linkedstat} (+${this.modifier * this.getlinkedvalue()})`
                    }
                    else bonusstring = `${this.modifier}x ${this.linkedstat} ()`
                }
                else bonusstring = `Undef. Operator: ${this.operation}. Modifier: ${this.modifier}`
                var returnstr = `
                    <tr>
                        <td>${this.source}</td> 
                        <td>${bonusstring}</td>
                `
                if (this.removable) returnstr += `<td><input value="Remove" type="button" onclick="{Mutator.destroy('${this.id}'); updateCharacterSheet()}"></td>`

                returnstr += `</tr>`
                return returnstr
            }
        }

            }

                    return MapofListsTemp.get(this.selectableOptions)
                }
                else {
                    return this.selectableOptions
                }

        class Stat extends IDRegistry(class { }) {
            dataType = "Stat"
            display = { open: false }
            constructor({
                name = "undefined",
                base = 6,
                linked_stats = [],
                displayclasses = ["statnameadjustable","statdisplay","stattextfield"],
                calculate = false,
                scenario = "",
                basemultiplier = 1,
                bonuses = [],
                deletable = false,
                calculationfunction = "Stat_Sum",
                ...args
            } = {}) {
                super(args)
                this.name = name
                this.displayclasses = displayclasses
                this.base = base
                this.linked_stats = linked_stats
                this.deletable = deletable
                this.basemultiplier = basemultiplier
                this.calculate = calculate
                this.calculationfunction = calculationfunction
                this.current = this.base
                this.bonuses = recursiveInstantiateArray(bonuses)
                //this.dependents = []
                //for (const linkedstat of this.linked_stats) {
                //    if (linkedstat instanceof Stat) linkedstat.dependents.push(this)
                //}
            }
            addbonus(curmutator) {
                this.bonuses.push(curmutator)
                curmutator.parentid = this.id
                this.update()
            }
            delete() {
                Character.CurrentCharacter.removeCustomStat(this.id)
            }
            removebonus(id) {
                for (const item of this.bonuses) {
                    if (item.id == id) {
                        var idx = this.bonuses.indexOf(item)
                        if (idx > -1) {
                            this.bonuses.splice(idx, 1)
                        }
                    }
                }
                this.update()
            }
            update() {
                this.IDUpdate()

                if (this.calculate && this.calculationfunction != "null") {
                    this.base = this.basemultiplier * CustomFunctions.get(this.calculationfunction)(this)
                }
                this.current = this.base
                for (const mutator of this.bonuses) {
                    this.current = mutator.mutate(this.current)
                }
                //for (const obj of this.dependents) {
                //    obj.update()
                //}
            }
            mutatordialog() {
                var genhtml = ""
                genhtml += `<dialog open>
                    <input type="button" value="Cancel" onclick="document.getElementById('Dialog').innerHTML = '';"><br>
                    Add modifier to ${this.name} (ID: ${this.id})<br>

                    Source:<input type="text" id="dialogSource"><br>
                    Operation:<select id="dialogOperation">
                        <option value="add">Add</option>
                        <option value="mul">Multiply by</option>
                        <option value="percent">Add Percentage</option>
                        <option value="stat">Linked Stat</option>
                    </select><br>
                    Value:<input type="text" id="dialogValue" value="0"><br>
                    (Linked Stat only) Stat: <select id="dialogStatNamed">`
                    genhtml += `<option>Unselected</option>` 
                    for (const statname of Character.CurrentCharacter.Stats.keys()) {
                        genhtml += `<option value="${statname}">${statname}</option>`
                    }    
                    genhtml += `</select><br>
                    OR Enter Stat by ID:<input type="text" id="dialogStatID"><br>
                    <input value="Add new modifier" type="button" onclick="Stat.ActiveObjects.get('${this.id}').mutatordialogfinish()">`
                genhtml += `</dialog>`
                document.getElementById("Dialog").innerHTML = genhtml

            }
            mutatordialogfinish() {
                //alert(`${document.getElementById("dialogOperation").value} ${document.getElementById("dialogValue").value}`)
                this.addbonus(new Mutator({
                    source: document.getElementById("dialogSource").value,
                    modifier: Number(document.getElementById("dialogValue").value),
                    linkedstat: (document.getElementById("dialogStatID").value != "" ? document.getElementById("dialogStatID").value : document.getElementById("dialogStatNamed").value),
                    operation: String(document.getElementById("dialogOperation").value)
                }))
                document.getElementById("Dialog").innerHTML = ""
                updateCharacterSheet()

            }
            toHTML(scenario,addins={}) {
                this.update()
                if (scenario == "Inventory") {
                    return ""
                }
                else {
                    var genhtml = ""
                    var framename = `DOM-${FrameIDCounter++}_${this.id}`
                    
                    genhtml += `<details 
                        ${this.display.open ? ' open' : ''} 
                        id="${framename}_Toggle" 
                        ontoggle="Stat.ActiveObjects.get('${this.id}').display.open = document.getElementById('${framename}_Toggle').open"
                        >`
                    
                    genhtml += `<summary>`
                    genhtml += `<div class="${this.displayclasses[0]}">${this.name}:</div>`
                    if (addins.beforeStat) genhtml += addins.beforeStat
                    
                    
                    if (this.calculate) { // It's calculated, so you can't change it. Only display the base IF there are modifiers.
                        genhtml += `<div class="${this.displayclasses[1]}">${this.current}</div>`
                        
                        genhtml += `</summary>`
                        
                        // Modifiers Table
                        genhtml += `<table>`
                        if (this.bonuses.length > 0) {
                            genhtml += `<tr>`
                            // Base Display
                            genhtml += `<td><div>Base:</div></td>`
                            // Stat Text Field (Should be able to be made editable or not)
                            genhtml += `<td><div class="statdisplay">${this.base}</div></td>`
                            genhtml += `</tr>`
                        }
                        
                    }
                    else if (this.bonuses.length == 0) { // Empty Bonuses: Display a simplified, directly-changeable value
                        genhtml += `<input class="${this.displayclasses[2]}" type="text" id="${framename}_Base" value="${this.base}" onchange="{
                            Stat.ActiveObjects.get('${this.id}').base = Number(document.getElementById('${framename}_Base').value);
                            Stat.ActiveObjects.get('${this.id}').update();
                            updateCharacterSheet()
                            }">`
                        genhtml += `</summary>`
                        
                        // Modifiers Table
                        genhtml += `<table>`
                    }
                    else {
                        genhtml += `<div class="${this.displayclasses[1]}">${this.current}</div>`
                        genhtml += `</summary>`
                        
                        // Modifiers Table
                        genhtml += `<table>`
                        
                        genhtml += `<tr>`
                        // Base Display
                        genhtml += `<td><div>Base:</div></td>`
                        // Stat Text Field (Should be able to be made editable or not)
                        genhtml += `<td><input class="${this.displayclasses[2]}" type="text" id="${framename}_Base" value="${this.base}" onchange="{
                            Stat.ActiveObjects.get('${this.id}').base = Number(document.getElementById('${framename}_Base').value);
                            Stat.ActiveObjects.get('${this.id}').update();
                            updateCharacterSheet()
                            }"></td>`
                        genhtml += `</tr>`
                    }

                    if (this.deletable) {
                        genhtml += `<input value="Delete this stat" type="button" onclick="{Stat.ActiveObjects.get('${this.id}').delete();updateCharacterSheet()}">`
                    }
                    genhtml += `</details>`
                    return genhtml
                }

            }
        }
        class Dynamic extends Stat {
            dataType = "Dynamic"
            dynvalue // true current value
            constructor({
                dynvalue = "Max",
                turnresetvalue = null,
                globalresetvalue = "Max",
                buttons = [],
                ...args
            } = {}) {
                super(args)
                this.turnresetvalue = turnresetvalue
                this.globalresetvalue = globalresetvalue
                this.buttons = buttons
                if (dynvalue == "Max") {
                    this.dynvalue = this.current
                }
                else this.dynvalue = dynvalue
            }

                    return this.Stats.get(variable) ?

                        Object.assign(this.Stats.set(variable,newclass).get(variable),value)

                const f = ((x) => {

                })
                const g = ((x, y, z) => {
                    return ifset(x, new Dynamic({
                        name: x,
                        displayclasses: ["statname","statdisplay","stattextfield"],

                        basemultiplier: 2

                            <td>${this.Stats.get("Mystique").toHTML()}</td>
                        </tr>
                        <tr>
                            <td>${this.Stats.get("Energy").toHTML()}</td>
                            <td>${this.Stats.get("Dodge").toHTML()}</td>
                            <td>${this.Stats.get("Control").toHTML()}</td>
                            <td>${this.Stats.get("Tempo").toHTML()}</td>
                        </tr>

                    </table>
                    `
                    genhtml += `</details>`
                    return genhtml
                }
                else if (scenario == "AspectsMenu") {
                    var genhtml = ""
                    genhtml += `<details 
                        class="statmenu"
                        ${this.display.aspectsmenu ? ' open' : ''}
                        id="${framename}_AspectsMenu_Toggle"
                        ontoggle="Character.CurrentCharacter.display.aspectsmenu = document.getElementById('${framename}_AspectsMenu_Toggle').open"
                        >`
                    genhtml += `<summary><h1>Aspects</h1></summary>`
                    genhtml += `<table id="AspectList" class="outlined">
                    <tr>
                        <th colspan="2" class="centeraligned">Aspect</th>
                        <th colspan="2" class="centeraligned">Resistance</th>
                        <th colspan="3" class="centeraligned">Dynamic Aspect</th>
                    </tr>
                    <tr>
                        <th>Group</th>
                        <th>Aspect</th>
                        <th>Resistance</th>
                        <th>Multiplier</th>
                        <th>Strike</th>
                        <th>Spell</th>
                        <th>Word</th>
                    </tr>`
                    for (const group of Object.keys(AspectGroups)) {
                        var itervar = 0
                        for (const aspect of AspectGroups[group]) {

                            genhtml += `<tr class='aspectgroup${group}'  id="Row${aspect + "Resistance"}">`
                            if (itervar == 0) {
                                genhtml += `<td rowspan='3' class='aspectgroup${group}'>${group}</td>`
                                itervar += 1
                            }
                            genhtml += `<td class='aspectgroup${group}'>${aspect}</td>`

                            // Resistances
                            var framename = `DOM-${FrameIDCounter++}_${this.id}`
                            genhtml += `<td><select 
                                    id="${framename}" 
                                    onchange="{
                                            Character.CurrentCharacter.Aspects.get('Resistances').set('${aspect}',document.getElementById('${framename}').value);
                                            updateCharacterSheet()
                                        }"
                                    >
                                <option value="Absorb"     ${Character.CurrentCharacter.Aspects.get("Resistances").get(aspect) == "Absorb"     ? "selected" : ""}>Absorb</option>
                                <option value="Immune"     ${Character.CurrentCharacter.Aspects.get("Resistances").get(aspect) == "Immune"     ? "selected" : ""}>Immune</option>
                                <option value="Resistant"  ${Character.CurrentCharacter.Aspects.get("Resistances").get(aspect) == "Resistant"  ? "selected" : ""}>Resistant</option>
                                <option value="Neutral"    ${Character.CurrentCharacter.Aspects.get("Resistances").get(aspect) == "Neutral"    ? "selected" : ""}>Neutral</option>
                                <option value="Weak"       ${Character.CurrentCharacter.Aspects.get("Resistances").get(aspect) == "Weak"       ? "selected" : ""}>Weak</option>
                                <option value="Vulnerable" ${Character.CurrentCharacter.Aspects.get("Resistances").get(aspect) == "Vulnerable" ? "selected" : ""}>Vulnerable</option>
                                <option value="Fatal"      ${Character.CurrentCharacter.Aspects.get("Resistances").get(aspect) == "Fatal"      ? "selected" : ""}>Fatal</option>
                            </select></td>`

                            // Multipliers
                            genhtml += `<td>${this.resistanceToMultiplier(Character.CurrentCharacter.Aspects.get("Resistances").get(aspect))}x</td>`

                            for (const type of ["Strike", "Spell", "Word"]) {
                                
                                genhtml += `<td class="centeraligned">
                                    <input 
                                        ${this.Aspects.get(`Dyn${type}`).has(aspect) ? "checked" : ""}
                                    type="checkbox" 
                                    value="${this.Aspects.get(`Dyn${type}`).has(aspect)}"
                                    onchange="{
                                        if (Character.CurrentCharacter.Aspects.get('Dyn${type}').has('${aspect}')) {
                                            Character.CurrentCharacter.Aspects.get('Dyn${type}').delete('${aspect}')
                                        } else {
                                            Character.CurrentCharacter.Aspects.get('Dyn${type}').add('${aspect}')
                                        };
                                        updateCharacterSheet()
                                    }"
                                >
                                </td>`
                            }
                            genhtml += "</tr>"
                        }
                    }
                    genhtml += "</table>"
                    genhtml += `</details>`
                    return genhtml
                }
                else if (scenario == "BrandsMenu") {
                    var genhtml = ""
                    genhtml += `<details 
                        class="statmenu"
                        ${this.display.brandsopen ? ' open' : ''}
                        id="${this.id}_Brands_Toggle"
                        ontoggle="Character.CurrentCharacter.display.brandsopen = document.getElementById('${this.id}_Brands_Toggle').open"
                        >`
                    
                    genhtml += `<summary><h1>Brands</h1></summary>`
                    
                    genhtml += `<table>`
                    for (const brand of this.Brands) {
                        genhtml += `<tr><td>${brand.toHTML()}</td></tr>`
                    }
                    genhtml += `</table>`
                    genhtml += `<input value="New Brand" type="button" onclick="Character.CurrentCharacter.Brands.push(new Brand());updateCharacterSheet()">`
                    genhtml += `</details>`
                    return genhtml
                }
                else if (scenario == "QuickActions") {
                    var genhtml = ""
                    genhtml += `<details 
                        class="statmenu"
                        ${this.display.quickactionsopen ? ' open' : ''}
                        id="${this.id}_QuickActions_Toggle"
                        ontoggle="Character.CurrentCharacter.display.quickactionsopen = document.getElementById('${this.id}_QuickActions_Toggle').open"
                        >`

                    genhtml += `<summary><h1>Quick Actions</h1></summary>`
                    var attackString = ""

                    genhtml += `<table>`
                    // Actually just manually added uneditable quick actions
                    genhtml += `<tr><td>
                            <details class="${(2 <= this.Stats.get("Energy").dynvalue) ? 'usable' : 'unusable'}"><summary><table class="inline"><tr>
                                <td><div class="actionname">Reaction: Basic Dodge</div></td>
                                <td><div class="statnameadjustable">En. Cost:</div><div class="statdisplay">2</div></td>
                                <td><div class="statnameadjustable">Trigger:</div><div class="statdisplaylong">When attacked</div></td>
                                <td><div class="statnameadjustable">Movement:</div><div class="statdisplay">8</div></td>
                            </tr></table></summary>
                            Dodge an attack by physically moving up to 8 feet out of the way.<br>
                            * If you leave the area of the attack, then you are considered to have dodged it.<br>
                            * Your Dodge must be higher than the enemy's Accuracy in order to use this action.<br>
                            * If your Dodge is at least (4x the enemy's Rank) greater than the enemy's Accuracy, this action becomes free.
                        </details>
                        </td></tr>
                            `
                    var totalblock = 0
                    for (const item of this.CharacterInventory.InventoryItems) {
                        if (item instanceof Weapon && item.equipped.base == "Yes") {
                            totalblock += item.block.current
                        }
                    }
                    genhtml += `<tr><td>
                            <details class="${(2 <= Character.CurrentCharacter.Stats.get("Energy").dynvalue) ? 'usable' : 'unusable'}"><summary><table class="inline"><tr>
                                <td><div class="actionname">Reaction: Basic Defense</div></td>
                                <td><div class="statnameadjustable">En. Cost:</div><div class="statdisplay">2</div></td>
                                <td><div class="statnameadjustable">Trigger:</div><div class="statdisplaylong">When attacked</div></td>
                                <td><div class="statnameadjustable">Block:</div><div class="statdisplay">${totalblock}</div></td>
                            </tr></table></summary>
                            You hold your weapons (or shields) up in order to brace yourself against damage.<br>
                            * Reduce the damage you take for this turn by 1x your total Block value amongst all handhelds.
                        </details>
                        </td></tr>
                            `

                    // Player weapons
                    for (const item of this.CharacterInventory.InventoryItems) {
                        if (item instanceof Weapon && item.equipped.base == "Yes") {
                            genhtml += `<tr><td>${item.toHTML(scenario= "QuickActions")}</td></tr>`
                        }
                    }
                    
                    genhtml += `<tr><td>
                            <details class="${2 <= Character.CurrentCharacter.Stats.get("TurnEnergy").dynvalue ? 'usable' : 'unusable'}"><summary><table class="inline"><tr>
                                <td><div class="actionname">Action: Basic Strike</div></td>
                                <td><div class="statnameadjustable">En. Cost:</div><div class="statdisplay">2</div></td>
                                <td><div class="statnameadjustable">Reach:</div><div class="statdisplay">8</div></td>
                                <td><div class="statnameadjustable">ATK:</div>
                                    <div class="statdisplayadjustable">(${this.Stats.get("Control").current} Acc) ${this.Stats.get("Strength").current} (Physical) Pummeling Damage</div></td>
                            </tr></table></summary>
                            Make a basic strike upon an enemy. This can be a punch, a kick, or any other manner of physical attack.
                        </details>
                        </td></tr>
                            `
                    genhtml += `<tr><td>
                            <details class="${2 <= Character.CurrentCharacter.Stats.get("TurnEnergy").dynvalue ? 'usable' : 'unusable'}"><summary><table class="inline"><tr>
                                <td><div class="actionname">Action: Basic Spell</div></td>
                                <td><div class="statnameadjustable">En. Cost:</div><div class="statdisplay">2</div></td>
                                <td><div class="statnameadjustable">Range:</div><div class="statdisplay">20</div></td>
                                <td><div class="statnameadjustable">ATK:</div>
                                    <div class="statdisplayadjustable">(${this.Stats.get("Control").current} Acc) ${this.Stats.get("Will").current} (Magical) Force Damage</div></td>
                            </tr></table></summary>
                            You summon up your raw will without a focus and channel it into a simple blast.
                        </details>
                        </td></tr>
                            `
                    genhtml += `<tr><td>
                            <details class="${2 <= Character.CurrentCharacter.Stats.get("TurnEnergy").dynvalue ? 'usable' : 'unusable'}"><summary><table class="inline"><tr>
                                <td><div class="actionname">Action: Basic Word</div></td>
                                <td><div class="statnameadjustable">En. Cost:</div><div class="statdisplay">2</div></td>
                                <td><div class="statnameadjustable">Area:</div><div class="statdisplay">12</div></td>
                                <td><div class="statnameadjustable">ATK:</div>
                                    <div class="statdisplayadjustable">(${this.Stats.get("Control").current} Acc) ${this.Stats.get("Ego").current} (Mental) Sonic Damage</div></td>
                            </tr></table></summary>
                            You scream from the top of your lungs, spewing insults towards those around you.
                        </details>
                        </td></tr>
                            `
                    
                    genhtml += `</table>`
                    genhtml += `</details>`
                    return genhtml
                }
                else if (scenario == "BrandAbilities") {
                    var genhtml = `<details 
                        class="statmenu"
                        ${this.display.brandactionsopen ? ' open' : ''}
                        id="${this.id}_BrandActions_Toggle"
                        ontoggle="Character.CurrentCharacter.display.brandactionsopen = document.getElementById('${this.id}_BrandActions_Toggle').open"
                        >`
                    genhtml += `<summary><h1>Brand Abilities</h1></summary>`
                    genhtml += `<table class="outlined>`
                    genhtml += `<tr><th>Killllll</th></tr>`

                    for (const brand of this.Brands) {
                        genhtml += `<tr><th>${brand.BrandName.base}</th></tr>`
                        var itervar = 0
                        while (itervar < 12) {
                            if (brand.Skills[itervar]) genhtml += `<tr><td>${brand.skillHTML(itervar,"BrandAbilities")}</td></tr>`
                            itervar += 1
                        }
                    }
                    genhtml += `</table></details>`
                    return genhtml
                }
                else if (scenario == "DamageCalculator") {
                    var genhtml = `<details
                        class="statmenu"
                        ${this.display.damagecalculatoropen ? ' open' : ''}
                        id="${this.id}_DamageCalculator_Toggle"
                        ontoggle="Character.CurrentCharacter.display.damagecalculatoropen = document.getElementById('${this.id}_DamageCalculator_Toggle').open"
                        >`
                    genhtml += `<summary><h1>Damage Calculator (WIP)</h1></summary>`
                    genhtml += `<table>`
                    genhtml += `<tr><td>${this.DCStats.get("Form").toHTML()}</td></tr>`
                    genhtml += `<tr><td>${this.DCStats.get("Aspect").toHTML()}</td></tr>`
                    genhtml += `<tr><td>${this.DCStats.get("Modifiers").toHTML()}</td></tr>`
                    genhtml += `<tr><td>${this.DCStats.get("Damage").toHTML()}</td></tr>`
                    
                    var tempdamage = 0
                    var tempform = this.DCStats.get("Form").base
                    var tempaspect = this.DCStats.get("Aspect").base
                    var tempdefense = 0
                    var temparmor = 0
                    if (tempform == "Physical") {
                        tempdefense = this.Stats.get("Fortitude").current
                        temparmor = this.Stats.get("PhysicalDefense").current - tempdefense
                    }
                    if (tempform == "Magical") {
                        tempdefense = this.Stats.get("Intuition").current
                        temparmor = this.Stats.get("MagicalDefense").current - tempdefense
                    }
                    if (tempform == "Mental") {
                        tempdefense = this.Stats.get("Mystique").current
                        temparmor = this.Stats.get("MentalDefense").current - tempdefense
                    }

                    tempdamage += this.DCStats.get("Damage").current
                    //genhtml += `<tr><td>${tempdamage}</td></tr>`

                    if (!this.DCStats.get("Modifiers").getValue("Armor Piercing") && !this.DCStats.get("Modifiers").getValue("Hazard")) {
                        tempdamage -= temparmor
                        if (tempdamage < 0) tempdamage = 0
                    }
                    if (!this.DCStats.get("Modifiers").getValue("Hazard")) {
                        tempdamage -= tempdefense
                        if (tempdamage < 0) tempdamage = 0
                    }

                    var aspectmult = 1
                    //genhtml += `<tr><td>${tempaspect}</td></tr>`
                    if (tempaspect != null) {
                        aspectmult = this.resistanceToMultiplier(this.Aspects.get("Resistances").get(tempaspect))
                    } 
                    tempdamage *= aspectmult
                    if (tempdamage <= 0) {
                        genhtml += `<tr><td><div class="statnameadjustable">Damage:</div><div class="statdisplaylong">Not strong enough to damage you.</div></td></tr>`
                    }
                    else {
                        genhtml += `<tr><td><div class="statnameadjustable">Damage:</div><div class="statdisplaylong">${tempdamage} (${tempform}) ${tempaspect} damage</div></td></tr>`

                    }

                    genhtml += `</table>`
                    genhtml += `</details>`
                    return genhtml

                }
            }
        }

        // <===================Save Files==================>

        function jsonreplacer(key, value) {
            if (value instanceof Set ) return [...value]
            if (value instanceof Map) {
                return {
                dataType: 'Map',
                value: Array.from(value.entries()), // or with spread: value: [...value]
                };
            } else {
                return value;
            }
        }
        function jsonreviver(key, value) {
            if (key === 'tags' && Array.isArray(value)) {
                return new Set(value);
            }
            if(typeof value === 'object' && value !== null) {
                if (value.dataType === 'Map') {
                return new Map(value.value);
                }
            }
            return value;
        }
        document.getElementById('characterFileInput').addEventListener('change', async (event) => {

            const curFile = event.target.files[0]
            if (!curFile) return;
            try {
                const fileContent = await curFile.text()

                setCharactertoCharacter(JSON.parse(fileContent,jsonreviver))
            } catch (error) {
                console.error("Error reading file:", error)
            }

        })
        function setCharactertoCharacter(character) {
            Character.CurrentCharacter = new Character(character)

            CurrentCharacter = Character.CurrentCharacter
            CurrentCharacter.resetstats()
            CurrentCharacter.update()
            updateCharacterSheet()
        }
        function downloadCharacter() {
            // Create a blob of the data
            var fileToSave = new Blob([JSON.stringify(CurrentCharacter, jsonreplacer, 4)], {
                type: 'application/json'
            });
            const fileURL = URL.createObjectURL(fileToSave)
            const link = document.createElement('a')
            link.href = fileURL
            link.download = `mbchar_${Character.CurrentCharacter.Stats.get("Name").base}.json`
            link.click()
            URL.revokeObjectURL(fileURL)
            
        }
        function HandleSaveFile(character) {
            var jsonData = JSON.stringify(character)
            var fs = require('fs');
            fs.writeFile("test.txt", jsonData, function (err) {
                if (err) {
                    console.log(err);
                }
            });
        }

        // <====================Display====================>

        function updateCharacterSheet() {
            for (id of Stat.ActiveObjects.keys()) {
                Stat.ActiveObjects.get(id).update()
            }
            Character.CurrentCharacter.CharacterInventory.update()
            Character.CurrentCharacter.update()
            document.getElementById("CharacterInfo").innerHTML = Character.CurrentCharacter.toHTML("CharacterInfo")

            document.getElementById("StatsMenu").innerHTML = Character.CurrentCharacter.toHTML("StatsMenu")
            document.getElementById("CustomStatsMenu").innerHTML = Character.CurrentCharacter.toHTML("CustomStatsMenu")
            document.getElementById("DamageCalculator").innerHTML = Character.CurrentCharacter.toHTML("DamageCalculator")
            document.getElementById("QuickActions").innerHTML = Character.CurrentCharacter.toHTML("QuickActions")

            document.getElementById("CharacterSheetInventory").innerHTML = Character.CurrentCharacter.CharacterInventory.toHTML()
            document.getElementById("WeaponsInventory").innerHTML = Character.CurrentCharacter.CharacterInventory.toHTML(scenario="WeaponsInventory")
            document.getElementById("ArmorsInventory").innerHTML = Character.CurrentCharacter.CharacterInventory.toHTML(scenario="ArmorsInventory")
            document.getElementById("AccessoriesInventory").innerHTML = Character.CurrentCharacter.CharacterInventory.toHTML(scenario="AccessoriesInventory")
            document.getElementById("AspectList").innerHTML = Character.CurrentCharacter.toHTML("AspectsMenu")
            document.getElementById("BrandsList").innerHTML = Character.CurrentCharacter.toHTML("BrandsMenu")
            document.getElementById("BrandAbilities").innerHTML = Character.CurrentCharacter.toHTML("BrandAbilities")

            //var genhtml = ""
            //for (const type of ActionTypes) {
            //    genhtml += `<br>${type}`
            //    for (const aspect of Character.CurrentCharacter.Aspects.get(`Dyn${type}`)) genhtml += aspect
            //
            //}
            //document.getElementById("UnlockedDynamics").innerHTML = genhtml

        }


        // <=======Runtime=========>
        new Item()
        new Equipment()
        new Weapon()
        new Mutator()
        CurrentCharacter = new Character()
        updateCharacterSheet()
    </script>
